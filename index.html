<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SN Enterprises · Inventory</title>
<meta name="theme-color" content="#0b1f3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SN Stock">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ink:#0b1f3a; --ink2:#16305a; --accent:#f97316; --accent-d:#c2570c; --accent-l:#fff1e6;
  --bg:#f3f5f9; --card:#fff; --soft:#eef1f7; --line:#e2e6ee; --muted:#6b7686; --text:#17202e; --field:#fff; --fieldline:#cdd4e0;
  --ok:#15803d; --okbg:#dcfce7; --warn:#a16207; --warnbg:#fef3c7; --bad:#b91c1c; --badbg:#fee2e2; --info:#1d4ed8; --infobg:#dbeafe;
  --radius:14px; --tabh:64px; --safe:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0c1320;--card:#141d2e;--soft:#1b2740;--line:#26334d;--muted:#93a0b5;--text:#e8edf6;--field:#101a2b;--fieldline:#33425f;
    --accent-l:#3a2411;--okbg:#10361f;--warnbg:#3a2d0b;--badbg:#401617;--infobg:#14284f;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--info:#93c5fd}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
a{color:var(--info)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header + navigation */
header.top{background:var(--ink);color:#fff;position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top,0)}
.bar{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.5px}
.brand b{display:block;font-size:15px;letter-spacing:.4px;line-height:1.1}
.brand span{display:block;font-size:10.5px;opacity:.7;letter-spacing:1.4px;text-transform:uppercase}
nav#nav{display:none;gap:2px;flex:1}
nav#nav a{color:#cdd7e8;text-decoration:none;padding:8px 12px;border-radius:9px;font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap}
nav#nav a:hover{background:var(--ink2)}
nav#nav a.on{background:var(--accent);color:#fff}
.sync{margin-left:auto;font-size:12px;display:flex;align-items:center;gap:8px;opacity:.95}
.sync button{background:rgba(255,255,255,.12);color:#fff;border:0;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;cursor:pointer}
.dot{width:9px;height:9px;border-radius:50%;background:#94a3b8;display:inline-block;flex:none}
.dot.live{background:#22c55e}.dot.demo{background:#f59e0b}.dot.bad{background:#ef4444}.dot.busy{background:#60a5fa;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--tabh) + var(--safe));padding-bottom:var(--safe)}
#tabbar a,#tabbar button{background:none;border:0;color:var(--muted);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;cursor:pointer;padding:0}
#tabbar .on{color:var(--accent)}
#tabbar .fab{position:relative}
#tabbar .fab span.c{position:absolute;top:-18px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(249,115,22,.45)}
#tabbar .fab svg{width:26px;height:26px}
#tabbar .fab em{font-style:normal;margin-top:30px}
main{max-width:1240px;margin:0 auto;padding:16px 16px calc(var(--tabh) + var(--safe) + 90px)}
@media(min-width:900px){
  nav#nav{display:flex}#tabbar{display:none}
  main{padding:22px 20px 60px}
}
.sync .txt{display:none}@media(min-width:560px){.sync .txt{display:inline}}
.brand span{display:none}@media(min-width:420px){.brand span{display:block}}

/* sign-in */
body.out header.top .sync,body.out nav#nav,body.out #tabbar{display:none!important}
body.out main{padding-bottom:40px}
.login{max-width:400px;margin:6vh auto 0}
.login .card{padding:26px 22px;box-shadow:0 12px 40px rgba(11,31,58,.12)}
.login .lg{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.login .lg .logo{width:46px;height:46px;font-size:17px;border-radius:12px}
.login .lg b{display:block;font-size:18px;letter-spacing:.3px}
.login .lg span{color:var(--muted);font-size:13px}
.login .field{margin-bottom:14px}
.pwrow{position:relative}.pwrow input{padding-right:64px}
.pwrow button{position:absolute;right:4px;top:4px;min-height:36px;padding:0 12px;background:none;color:var(--info);font-size:13px}
.userbtn{display:none;align-items:center;gap:8px;background:rgba(255,255,255,.12);color:#fff;padding:0 12px 0 6px;height:34px;min-height:0;border-radius:99px;font-size:13px;max-width:150px}
.userbtn .av{width:24px;height:24px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.userbtn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.in .userbtn{display:flex}
.staffbtn{display:none;margin-left:auto;background:rgba(255,255,255,.14);color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:8px 14px;border-radius:99px;white-space:nowrap}
.staffbtn:hover{background:rgba(255,255,255,.24)}
body.out:not(.onlogin) .staffbtn{display:inline-flex}
.pubitem{margin-bottom:12px}.pubitem .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}.pubitem h2{margin:0}
.pubitem td b{font-size:15px}.pubitem td.z{color:var(--muted)}
.live-dot{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
@media(max-width:559px){.userbtn .nm{display:none}.userbtn{padding:0 5px}}
.rolepill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--infobg);color:var(--info)}

/* stock register */
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.chiprow button{flex:none;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-height:46px;text-align:left;line-height:1.2}
.chiprow button small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.chiprow button.on{background:var(--ink);border-color:var(--ink);color:#fff}.chiprow button.on small{color:#b9c6dc}
.reghead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 0 12px}
.reghead h2{font-size:24px;margin:0;letter-spacing:.2px}
.reghead .tot{font-size:13px;color:var(--muted)}.reghead .tot b{display:block;font-size:30px;color:var(--text);line-height:1.1;letter-spacing:-.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:10px 2px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.regwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
table.reg{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
table.reg th,table.reg td{padding:11px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;min-width:54px}
table.reg thead th{background:var(--soft);color:var(--muted);font-size:11.5px;letter-spacing:.7px;text-transform:uppercase;position:sticky;top:0}
table.reg .sn{min-width:40px;width:40px;color:var(--muted);font-size:12.5px}
table.reg .cl{text-align:left;font-weight:700;min-width:120px;position:sticky;left:0;background:var(--card);z-index:1}
table.reg thead .cl{background:var(--soft);z-index:2}
table.reg .sn{position:sticky;left:0;background:var(--card);z-index:1}
table.reg thead .sn{background:var(--soft);z-index:2}
table.reg td.c{font-size:16px;font-weight:600}
table.reg td.c.clk{cursor:pointer}table.reg td.c.clk:hover{background:var(--accent-l);box-shadow:inset 0 0 0 2px var(--accent)}
table.reg td.zero{color:var(--bad);background:var(--badbg);font-weight:700}
table.reg td.zp{color:var(--muted);font-weight:500}
table.reg td.lowc{background:var(--warnbg);color:var(--warn);font-weight:800}
table.reg td.neg{background:var(--bad);color:#fff}
table.reg td.na{color:var(--line);font-weight:400}
table.reg td.rt,table.reg th.rt{background:var(--soft);font-weight:800;border-left:2px solid var(--line);position:sticky;right:0;z-index:1}
table.reg td.rt{font-size:16px}table.reg th.rt{z-index:2}
table.reg tbody tr:hover td:not(.c){background:var(--soft)}
table.reg tfoot td{font-weight:800;font-size:16px;background:var(--soft);border-top:2px solid var(--ink);border-bottom:0}
table.reg tfoot td.cl,table.reg tfoot td.sn{background:var(--soft)}
table.reg tfoot td.gt{background:var(--ink);color:#fff;font-size:17px;position:sticky;right:0;z-index:1}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25);flex:none}
.cph{display:inline-block;width:28px;height:28px;border-radius:50%;border:2.5px solid var(--fieldline);margin-right:8px;vertical-align:middle;overflow:hidden;background:var(--soft);flex:none;box-sizing:border-box}
.cph img{width:100%;height:100%;object-fit:cover;object-position:50% 36%;display:block;transform:scale(1.7);transform-origin:50% 30%}
td.hasph{cursor:pointer}td.hasph:hover{background:var(--accent-l)!important}
.lbimg{display:block;width:100%;max-height:72vh;object-fit:contain;border-radius:12px;background:var(--soft)}
@media(max-width:560px){
  /* phones: squeeze the whole register into the screen width, no sideways scrolling for up to ~8 sizes */
  table.reg th,table.reg td{padding:10px 1px;min-width:0}
  table.reg .sn{display:none}
  table.reg .cl{min-width:0;width:27%;white-space:normal;padding:8px 4px 8px 8px;font-size:13px;line-height:1.2;position:static}
  table.reg .sw{width:10px;height:10px;margin-right:4px}
  table.reg .cph{width:22px;height:22px;margin-right:4px;border-width:2px}
  table.reg thead th{font-size:10.5px;letter-spacing:.1px}
  table.reg td.c{font-size:13.5px}table.reg td.rt{font-size:13.5px}table.reg tfoot td{font-size:13px}table.reg tfoot td.gt{font-size:13.5px}
  table.reg td.rt,table.reg th.rt,table.reg tfoot td.gt{position:static}
  .pubitem{padding:8px 4px}.pubitem .ph{padding:0 6px}
  body.out main{padding-left:8px;padding-right:8px}
  table.reg td.c,table.reg td.rt{font-size:13px;font-weight:600}table.reg thead th{font-size:10px}
  .reghead h2{font-size:21px}
}
@media(max-width:400px){table.reg .cph{width:20px;height:20px;margin-right:3px}table.reg .sw{margin-right:3px}table.reg td.c,table.reg td.rt,table.reg tfoot td,table.reg tfoot td.gt{font-size:12px}table.reg .cl{font-size:11.5px;padding:8px 2px 8px 5px}table.reg thead th{font-size:9.5px;letter-spacing:0}table.reg td.rt,table.reg th.rt{border-left-width:1px}}
@media(max-width:340px){table.reg .cph{width:17px;height:17px;border-width:1.5px}table.reg .sw{width:8px;height:8px}body.out main{padding-left:5px;padding-right:5px}.pubitem{padding:8px 2px}table.reg td.c,table.reg td.rt,table.reg tfoot td,table.reg tfoot td.gt{font-size:10.5px;font-weight:600}table.reg .cl{font-size:10.5px;padding-left:4px}table.reg thead th{font-size:8.5px}}
@media(min-width:561px){table.reg th,table.reg td{min-width:54px}table.reg .cl{min-width:100px}}
@media print{.chiprow,.legend{display:none!important}.regwrap{border:0;overflow:visible}table.reg th,table.reg td{border:1px solid #000;color:#000!important;background:#fff!important}table.reg td.gt{background:#eee!important}.sw{display:none}}

/* typography + layout */
h1{font-size:22px;margin:0 0 14px;letter-spacing:-.2px}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:0 0 8px}
.muted{color:var(--muted)}.small{font-size:12.5px}.bad{color:var(--bad)}.ok{color:var(--ok)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(2,1fr);margin-bottom:14px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.two{grid-template-columns:1fr}@media(min-width:900px){.two{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card.flush{padding:0;overflow:hidden}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.7px}
.kpi .v{font-size:25px;font-weight:800;margin-top:2px;letter-spacing:-.3px}
.kpi.alert .v{color:var(--bad)}
.hero{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:14px}
@media(min-width:760px){.hero{grid-template-columns:repeat(3,minmax(0,220px))}}
.act{display:flex;align-items:center;gap:10px;padding:14px;border-radius:var(--radius);border:1px solid var(--line);background:var(--card);color:var(--text);text-decoration:none;font-weight:700}
.act.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.act small{display:block;font-weight:500;opacity:.8;font-size:12px}
.banner{background:var(--warnbg);color:var(--warn);border:1px solid rgba(161,98,7,.3);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px}
.banner.bad{background:var(--badbg);color:var(--bad);border-color:rgba(185,28,28,.3)}
.banner a{color:inherit;font-weight:700}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite;margin:60px auto}
@keyframes rot{to{transform:rotate(360deg)}}

/* controls */
input,select,textarea,button{font:inherit}
input,select,textarea{border:1px solid var(--fieldline);border-radius:10px;padding:10px 12px;background:var(--field);color:var(--text);min-width:0;min-height:44px;width:100%}
input[type=checkbox]{width:18px;height:18px;min-height:0;accent-color:var(--accent)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #fdba74;outline-offset:1px;border-color:var(--accent)}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:600}
label.inl{display:flex;gap:8px;align-items:center;margin:0;font-weight:500;font-size:14px;color:var(--text);min-height:44px}
.field{display:flex;flex-direction:column;min-width:0}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));margin-bottom:12px}
button{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:700;min-height:44px}
.btn{background:var(--accent);color:#fff}.btn:hover{background:var(--accent-d)}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--fieldline)}.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:var(--card);color:var(--bad);border:1px solid rgba(185,28,28,.4)}.btn.danger:hover{background:var(--badbg)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn.block{width:100%}
button:disabled{opacity:.5;cursor:not-allowed}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools .grow{flex:1 1 220px;min-width:0}.tools select{width:auto;flex:0 1 190px}
.sp{flex:1}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:var(--soft);color:var(--text);border:1px solid transparent;padding:8px 14px;border-radius:99px;font-weight:600;min-height:40px}
.seg button.on{background:var(--ink);color:#fff}
.seg.types button.on[data-dir="1"]{background:var(--ok);color:#fff}.seg.types button.on[data-dir="-1"]{background:var(--accent);color:#fff}
.tabs2{display:flex;border-bottom:1px solid var(--line);margin:-4px -4px 14px}
.tabs2 button{background:none;border-radius:0;color:var(--muted);border-bottom:3px solid transparent;flex:1;padding:10px}
.tabs2 button.on{color:var(--accent);border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:12.5px;cursor:pointer;min-height:0;font-weight:600;color:var(--text)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.low{background:var(--warnbg);color:var(--warn)}.pill.out{background:var(--badbg);color:var(--bad)}
.pill.in{background:var(--infobg);color:var(--info)}.pill.off{background:var(--soft);color:var(--muted)}

/* tables (cards on phones) */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);max-height:calc(100vh - 250px)}
.card .tablewrap{max-height:none}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);position:sticky;top:0;z-index:1}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
tr.cancelled td{color:var(--muted);text-decoration:line-through}tr.cancelled td.noL{text-decoration:none}
tr.tot td{font-weight:800;background:var(--soft)}
@media(max-width:700px){
  .tablewrap{border:0;background:none;max-height:none;overflow:visible}
  table.stack,table.stack tbody{display:block}
  table.stack thead{display:none}
  table.stack tr{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:10px}
  table.stack td{display:flex;justify-content:space-between;align-items:center;gap:14px;border:0;padding:3px 0;white-space:normal;text-align:right}
  table.stack td::before{content:attr(data-l);color:var(--muted);font-size:12.5px;text-align:left;flex:none}
  table.stack td.p{font-size:15.5px;text-align:left;padding-bottom:6px}
  table.stack td.p::before,table.stack td.noL::before{display:none}
  table.stack td.hm{display:none}
  table.stack td.noL{justify-content:flex-end;padding-top:6px}
  table.stack tr.tot{background:var(--soft)}
}

/* entry */
.eline{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.eline:last-child{border-bottom:0}
.eline .ed{min-width:0}.eline .ed b{word-break:break-all}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;padding:0;background:var(--soft);color:var(--text);font-size:20px}
.stepper input{width:64px;text-align:center;padding:8px 4px}
.eline .rate{display:flex;align-items:center;gap:8px}
.eline .rate input{width:96px}
.eline .amt{font-weight:700;font-variant-numeric:tabular-nums}
.eline .x{background:none;color:var(--muted);width:40px;padding:0}
.eline .ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;grid-column:1/-1;grid-row:2}
.eline .ed{grid-row:1;grid-column:1}.eline .x{grid-row:1;grid-column:2}
.eline .amt{margin-left:auto}
@media(min-width:760px){
  .eline{grid-template-columns:minmax(200px,1fr) auto auto 100px 40px}
  .eline .ctl{display:contents}
  .eline .ed,.eline .x{grid-row:auto;grid-column:auto}
  .eline .amt{margin-left:0;text-align:right}
}
.savebar{position:sticky;bottom:calc(var(--tabh) + var(--safe) + 8px);z-index:10;background:var(--ink);color:#fff;border-radius:var(--radius);padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(11,31,58,.35);margin-top:14px}
.savebar .sum{flex:1;font-size:13px;line-height:1.3}.savebar .sum b{font-size:17px;display:block}
@media(min-width:900px){.savebar{bottom:16px}}
.grid-entry{overflow:auto;border:1px solid var(--line);border-radius:12px}

<script src="config.js"></script>
<script>
'use strict';
/* ════════════════════════ helpers ════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => '₹' + (Number(n) || 0).toLocaleString('en-IN', {maximumFractionDigits: 2});
const num = n => (Number(n) || 0).toLocaleString('en-IN');
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const newId = () => 'M' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase();
const csvCell = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
const ICON = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>', box: '<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  more: '<path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3.5"/>', tag: '<path d="M20 12l-8 8-9-9V3h8z"/><path d="M7.5 7.5h.01"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>', gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  sync: '<path d="M21 12a9 9 0 0 1-15.5 6.2M3 12A9 9 0 0 1 18.5 5.8M18 2v4h-4M6 22v-4h4"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
  grid: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>', out: '<path d="M7 17L17 7M8 7h9v9"/>', in: '<path d="M17 7L7 17M16 17H7V8"/>',
};
const ic = k => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;

function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', bad ? 6000 : 2600);
}
function downloadCsv(name, rows) {
  const blob = new Blob(['﻿' + rows.map(r => r.map(csvCell).join(',')).join('\n')], {type: 'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function openDlg(html) {
  const d = $('#dlg'); d.innerHTML = `<div class="dc">${html}</div>`;
  if (!d.open) d.showModal();
  $$('[data-close]', d).forEach(b => b.onclick = () => d.close());
  return d;
}
$('#dlg').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
/* On phones, turn each table cell into a labelled line so rows read as cards */
function stackTables(root) {
  $$('table.stack', root).forEach(t => {
    const heads = $$('thead th', t).map(h => h.textContent.trim());
    $$('tbody tr', t).forEach(tr => $$('td', tr).forEach((td, i) => { if (heads[i] && !td.dataset.l) td.dataset.l = heads[i]; }));
  });
}

/* ════════════════════════ domain ════════════════════════ */
const TYPES = {
  SALE:            {label: 'Sale / dispatch',   short: 'Sale',            dir: -1, rate: 'sale'},
  PURCHASE:        {label: 'Purchase / inward', short: 'Purchase',        dir: 1,  rate: 'cost', costs: true},
  SALE_RETURN:     {label: 'Sales return',      short: 'Sales return',    dir: 1,  rate: 'sale'},
  PURCHASE_RETURN: {label: 'Purchase return',   short: 'Purchase return', dir: -1, rate: 'cost'},
  ADJ_IN:          {label: 'Adjustment (+)',    short: 'Adjust +',        dir: 1,  rate: 'cost', costs: true},
  ADJ_OUT:         {label: 'Adjustment (−)',    short: 'Adjust −',        dir: -1, rate: 'cost'},
  /* rows typed by hand straight into the “Inward/ Outward” tab; shown in lists, not offered when entering */
  INWARD:          {label: 'Inward (typed in sheet)',  short: 'Inward',  dir: 1,  rate: 'cost', hide: true},
  OUTWARD:         {label: 'Outward (typed in sheet)', short: 'Outward', dir: -1, rate: 'cost', hide: true},
};
const ROLES = {ADMIN: 'Super admin', EDITOR: 'Edit access', VIEWER: 'View only'};
const normS = v => String(v ?? '').trim().replace(/\s+/g, ' ').toLowerCase();
const keyOf = (item, colour, size) => [item, colour, size].map(normS).join('|');
const HSN_HINTS = [['6109','T-shirts, knitted'],['6110','Jerseys, pullovers, hoodies, knitted'],['6105','Men\'s shirts / polos, knitted'],
                   ['6103','Men\'s trousers, suits, knitted'],['6104','Women\'s trousers, suits, knitted'],['6112','Track suits, swimwear'],['6114','Other garments, knitted']];
const SIZE_ORDER = ['FREE','FREESIZE','XXS','XS','S','M','L','XL','XXL','2XL','3XL','XXXL','4XL','5XL'];
const sizeRank = s => { const u = String(s).toUpperCase().replace(/\s/g, ''); const i = SIZE_ORDER.indexOf(u); if (i >= 0) return i; const n = parseFloat(u); return isNaN(n) ? 500 : 100 + n; };

const state = {items: [], moves: [], orphans: 0, calc: null, loaded: false, error: '', busy: false};
const bySku = sku => state.calc?.bySku.get(String(sku || '').trim().toUpperCase());

function compute(items, moves) {
  const map = new Map();
  items.forEach(i => { const o = +i.opening || 0; map.set(i.sku, {...i, opening: o, inQty: 0, outQty: 0, onHand: o, costQty: o, costVal: o * (+i.cost || 0), hasMoves: o > 0, lastMove: ''}); });
  moves.forEach(m => {
    if (m.status !== 'ACTIVE') return;
    const r = map.get(m.sku); if (!r) return;
    r.hasMoves = true;
    if (m.signedQty > 0) r.inQty += m.signedQty; else r.outQty += -m.signedQty;
    r.onHand += m.signedQty;
    if (TYPES[m.type]?.costs && m.rate > 0) { r.costQty += m.qty; r.costVal += m.qty * m.rate; }
    if (m.date > r.lastMove) r.lastMove = m.date;
  });
  const rows = [...map.values()].map(r => {
    r.avgCost = r.costQty > 0 ? r.costVal / r.costQty : r.cost;     // weighted average of inward rates, else master cost
    r.value = Math.max(r.onHand, 0) * r.avgCost;
    r.status = !r.active ? 'OFF' : !r.hasMoves ? 'NEW' : r.onHand < 0 ? 'NEG' : r.onHand === 0 ? 'OUT'
             : (r.reorder > 0 && r.onHand <= r.reorder) ? 'LOW' : 'OK';
    return r;
  });
  return {rows, bySku: new Map(rows.map(r => [r.sku, r]))};
}
const PILL = {OK: ['ok', 'OK'], LOW: ['low', 'LOW'], OUT: ['out', 'OUT'], NEG: ['out', 'NEGATIVE'], OFF: ['off', 'INACTIVE'], NEW: ['in', 'NOT STOCKED']};
const pillFor = s => PILL[s] ? `<span class="pill ${PILL[s][0]}">${PILL[s][1]}</span>` : '';
const describe = i => [i.item, i.size, i.colour].filter(Boolean).join(' · ');
const rateFor = (it, type) => !it ? 0 : r2(TYPES[type].rate === 'sale' ? it.sale : (it.avgCost || it.cost));

/* ════════════════════════ storage / API ════════════════════════ */
const SESSION_KEY = 'snit_session_v2', DEMO_KEY = 'snit_demo_v2';
/* The Google Apps Script Web app is built in so staff never see or paste it.
   The URL alone gives no access: every request needs a sign-in token issued after user name + password. */
const BAKED_URL = (window.SN_CONFIG && window.SN_CONFIG.api) || '';      // set in config.js
const FORCE_DEMO = new URLSearchParams(location.search).has('demo');   // open index.html?demo to practise on sample data
const isLive = () => !FORCE_DEMO && !!BAKED_URL;
const DEMO_USER = {name: 'Demo', role: 'ADMIN'};
let session = null;
try { session = JSON.parse(localStorage.getItem(SESSION_KEY)); if (!session || !session.token || !session.user) session = null; } catch { session = null; }
const saveSession = s => { session = s; try { s ? localStorage.setItem(SESSION_KEY, JSON.stringify(s)) : localStorage.removeItem(SESSION_KEY); } catch {} };
const me = () => isLive() ? session?.user : DEMO_USER;
const signedIn = () => !!me();
const can = {
  entry: () => ['ADMIN', 'EDITOR'].includes(me()?.role),     // record stock movements
  admin: () => me()?.role === 'ADMIN',                        // items, edits, cancelling
};

async function post(body) {
  let res;
  try {
    res = await fetch(BAKED_URL, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(body), redirect: 'follow'});
  } catch (e) { throw new Error('Could not reach Google. Check your internet connection and try again.'); }
  if (!res.ok) throw new Error('Server returned HTTP ' + res.status);
  let data; try { data = await res.json(); } catch { throw new Error('Unexpected reply from the server. Is the Web app deployed with access “Anyone”?'); }
  return data;
}
async function api(action, payload = {}) {
  if (!isLive()) return demoApi(action, payload);
  if (!session) { const e = new Error('Please sign in.'); e.auth = true; throw e; }
  const data = await post({token: session.token, action, payload});
  if (!data.ok) {
    const e = new Error(data.error || 'Request failed');
    if (data.auth) { e.auth = true; endSession(e.message); }
    throw e;
  }
  return data;
}
async function doLogin(user, password) {
  const data = await post({action: 'login', payload: {user, password}});
  if (!data.ok) throw new Error(data.error || 'Could not sign in.');
  saveSession({token: data.token, user: data.user});
}
function endSession(msg) {
  saveSession(null); state.items = []; state.moves = []; state.calc = null; state.loaded = false; state.error = ''; E.lines = [];
  loginMsg = msg || ''; const h = msg ? '#/login' : ''; if (location.hash !== h && !(h === '' && !location.hash)) location.hash = h; render();
}
let loginMsg = '';

/* — demo mode: same contract as Code.gs, stored in this browser only — */
function demoSku(d, it) {
  const code = (s, n) => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, n);
  const base = [code(it.item, 10), code(it.size, 6), code(it.colour, 3)].filter(Boolean).join('-') || 'ITEM';
  let sku = base, n = 1; while (d.items.some(x => x.sku === sku)) sku = base + '-' + (++n);
  return sku;
}
function demoLoad() {
  try { const d = JSON.parse(localStorage.getItem(DEMO_KEY)); if (d && d.items) return d; } catch {}
  const d = {items: [], moves: []};
  let n = 0;
  const mk = (name, cat, hsn, gst, cost, sale, reorder, sizes, colours) => sizes.forEach(s => colours.forEach(c =>
    d.items.push({sku: demoSku(d, {item: name, size: s, colour: c}), item: name, category: cat, size: s, colour: c, hsn, gst, cost, sale, reorder, active: true, opening: 30 + (++n * 7) % 25})));
  mk('Polo T-Shirt', 'Polo T-Shirts', '6105', 5, 180, 299, 20, ['M','L','XL'], ['Navy','Black']);
  mk('Track Pant', 'Track Pants', '6103', 5, 220, 349, 15, ['M','L','XL'], ['Black']);
  mk('Team Jersey', 'Team Jerseys', '6110', 5, 260, 429, 10, ['S','M','L'], ['Royal Blue']);
  let k = 0;
  const sale = (item, colour, size, qty) => { const it = d.items.find(i => i.item === item && i.colour === colour && i.size === size);
    d.moves.push({id: 'DEMO' + (++k), date: '2026-04-12', type: 'SALE', sku: it.sku, item, colour, size, qty, signedQty: -qty, rate: it.sale,
      party: 'Sample Sports Club', ref: 'INV-001', enteredBy: 'Demo', createdAt: '2026-04-12 10:00:00', status: 'ACTIVE', cancelledAt: '', cancelledBy: '', cancelReason: ''}); };
  sale('Polo T-Shirt', 'Navy', 'M', 22); sale('Track Pant', 'Black', 'L', 14); sale('Team Jersey', 'Royal Blue', 'S', 26);
  return d;
}
const demoSave = d => localStorage.setItem(DEMO_KEY, JSON.stringify(d));
async function demoApi(action, p) {
  const d = demoLoad();
  const stock = () => { const m = {}; d.items.forEach(i => m[i.sku] = +i.opening || 0); d.moves.forEach(x => { if (x.status === 'ACTIVE') m[x.sku] = (m[x.sku] || 0) + x.signedQty; }); return m; };
  if (action === 'bootstrap') { demoSave(d); return {ok: true, user: DEMO_USER, items: d.items, moves: d.moves, orphans: 0}; }
  if (action === 'saveItem' || action === 'saveItems') {
    const list = action === 'saveItem' ? [p.item] : p.items, update = action === 'saveItem', saved = [], skipped = [];
    list.forEach(it => {
      if (!String(it.item || '').trim()) throw new Error('Item name is required.');
      const rec = {...it, gst: +it.gst || 0, cost: +it.cost || 0, sale: +it.sale || 0, reorder: +it.reorder || 0, opening: +it.opening || 0, active: it.active !== false};
      if (update) { const ix = d.items.findIndex(x => x.sku === it.sku); if (ix < 0) throw new Error('SKU ' + it.sku + ' does not exist.');
        const o = d.items[ix]; d.items[ix] = {...rec, sku: o.sku, item: o.item, colour: o.colour, size: o.size}; saved.push(o.sku); }
      else if (d.items.some(x => keyOf(x.item, x.colour, x.size) === keyOf(it.item, it.colour, it.size))) skipped.push([it.item, it.colour, it.size].join(' / '));
      else { rec.sku = demoSku(d, rec); d.items.push(rec); saved.push(rec.sku); }
    });
    demoSave(d); return {ok: true, saved, skipped};
  }
  if (action === 'addMovements') {
    const st = stock(), ids = new Set(d.moves.map(m => m.id)); const rows = [], dupes = [];
    p.movements.forEach((m, i) => {
      if (ids.has(m.id)) { dupes.push(m.id); return; }
      const t = TYPES[m.type]; if (!t) throw new Error(`Line ${i + 1}: unknown movement type.`);
      const sku = String(m.sku), it = d.items.find(x => x.sku === sku);
      if (!it) throw new Error(`Line ${i + 1}: item "${sku}" is not in the Stock Movement tab.`);
      const qty = +m.qty; if (!(qty > 0) || Math.round(qty) !== qty) throw new Error(`Line ${i + 1}: quantity must be a whole number above zero.`);
      const signed = t.dir * qty; if ((st[sku] || 0) + signed < 0) throw new Error(`Line ${i + 1}: ${sku} has only ${st[sku] || 0} in stock; cannot take out ${qty}.`);
      st[sku] = (st[sku] || 0) + signed;
      rows.push({id: m.id, date: m.date, type: m.type, sku, item: it.item, colour: it.colour, size: it.size, qty, signedQty: signed, rate: +m.rate || 0, party: m.party || '', ref: m.ref || '',
        enteredBy: DEMO_USER.name, createdAt: new Date().toISOString().slice(0, 19).replace('T', ' '), status: 'ACTIVE', cancelledAt: '', cancelledBy: '', cancelReason: ''});
    });
    d.moves.push(...rows); demoSave(d); return {ok: true, saved: rows.length, duplicates: dupes};
  }
  if (action === 'cancelMovement') {
    const m = d.moves.find(x => x.id === p.id); if (!m) throw new Error('Entry not found.');
    if (m.status === 'CANCELLED') return {ok: true, already: true};
    if (m.signedQty > 0 && (stock()[m.sku] || 0) - m.signedQty < 0) throw new Error(`Cannot cancel: ${m.sku} would go negative.`);
    m.status = 'CANCELLED'; m.cancelledAt = new Date().toISOString(); m.cancelledBy = DEMO_USER.name; m.cancelReason = p.reason || ''; demoSave(d); return {ok: true};
  }
  throw new Error('Unknown action ' + action);
}

/* ════════════════════════ data refresh ════════════════════════ */
async function refresh(quiet) {
  if (!signedIn()) { state.loaded = false; render(); return; }
  setSync('busy');
  try {
    const d = await api('bootstrap');
    if (isLive() && d.user && session) saveSession({token: session.token, user: d.user});    // role may have changed in the sheet
    state.items = d.items; state.moves = d.moves; state.orphans = d.orphans || 0; state.calc = compute(d.items, d.moves);
    state.loaded = true; state.error = ''; setSync('ok');
  } catch (e) { if (e.auth) return; state.error = e.message; setSync('err'); if (!quiet) toast(e.message, true); }
  render();
}
function setSync(s) {
  const live = isLive();
  $('#dot').className = 'dot ' + (s === 'busy' ? 'busy' : s === 'err' ? 'bad' : live ? 'live' : 'demo');
  $('#syncTxt').textContent = s === 'busy' ? 'Syncing…' : s === 'err' ? 'Not connected' : live ? 'Connected to Google Sheet' : 'Demo data';
}
async function write(action, payload, okMsg, onOk) {
  if (state.busy) return null;
  state.busy = true; setSync('busy');
  try { const r = await api(action, payload); if (onOk) onOk(r); toast(okMsg || 'Saved'); await refresh(true); return r; }
  catch (e) { if (!e.auth) { toast(e.message, true); setSync('err'); } return null; }
  finally { state.busy = false; }
}

const NAV = [['dashboard','Home','home'],['stock','Stock','box'],['register','Register','grid'],['entry','New entry','plus'],['moves','Movements','list'],['items','Items','tag'],['reports','Reports','chart'],['settings','Account','gear']];

function parseHash() {

  return {route: ok ? p : 'dashboard', q: ok ? Object.fromEntries(new URLSearchParams(qs)) : {}};
}

/* ── register table: colours down, sizes across, with totals (shared by the Register and the public page) ── */
const SWATCH = {yellow:'#facc15',grey:'#9ca3af',gray:'#9ca3af',navy:'#1e3a8a','navy blue':'#1e3a8a','sky blue':'#7dd3fc',sky:'#7dd3fc',orange:'#fb923c',peach:'#fdba9a',lavender:'#c4b5fd',black:'#111827',white:'#ffffff',
  red:'#ef4444',green:'#22c55e','bottle green':'#14532d','parrot green':'#4ade80',blue:'#3b82f6','royal blue':'#2563eb',maroon:'#7f1d1d',pink:'#f9a8d4',purple:'#a855f7',brown:'#92400e',beige:'#e7d9bd',cream:'#fef3c7',
  mustard:'#ca8a04',rani:'#db2777',turquoise:'#2dd4bf',teal:'#0d9488',wine:'#881337',coffee:'#6f4e37',silver:'#cbd5e1',gold:'#d4a017',offwhite:'#f5f5f0','off white':'#f5f5f0'};
const hexFor = c => { const k = normS(c); return SWATCH[k] || SWATCH[k.split(' ').pop()] || ''; };
/* Photo keys ignore case, spaces and punctuation, so “DOT KNIT”, “Dot-Knit” and “dotknit” are the same item. */
const pKey = v => String(v ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
let photoMap = null;
const photoFor = (item, colour) => {
  if (!photoMap) { photoMap = {}; const src = (window.SN_CONFIG && window.SN_CONFIG.photos) || {};
    Object.keys(src).forEach(k => { const [i, c = ''] = k.split('|'); photoMap[pKey(i) + '|' + pKey(c)] = src[k]; }); }
  return photoMap[pKey(item) + '|' + pKey(colour)] || '';
};
const swatch = (c, item) => {
  const h = hexFor(c), ph = photoFor(item, c);
  if (ph) return `<span class="cph" style="border-color:${h || 'var(--fieldline)'}"><img src="${esc(ph)}" alt="" loading="lazy" decoding="async"></span>`;
  return h ? `<i class="sw" style="background:${h}"></i>` : '';
};
function showPhoto(url, caption) {
  openDlg(`<div class="dh"><h2>${esc(caption)}</h2><button class="xbtn" data-close aria-label="Close">${ic('x')}</button></div><img class="lbimg" src="${esc(url)}" alt="${esc(caption)}">`);
}
document.addEventListener('click', e => { const t = e.target.closest('[data-photo]'); if (t) showPhoto(t.dataset.photo, t.dataset.cap); });
function registerTable(rows, clickable) {
  const sizes = [...new Set(rows.map(r => r.size))].sort((a, b) => sizeRank(a) - sizeRank(b) || a.localeCompare(b));
  const cols = [...new Set(rows.map(r => r.colour))], cell = {};     // colours stay in the order they are listed in the sheet, like the paper register
  rows.forEach(r => cell[r.size + '\u0000' + r.colour] = r);
  const colTot = sizes.map(() => 0); let grand = 0;
  const body = cols.map((c, ci) => {
    let rt = 0;
    const tds = sizes.map((sz, si) => {
      const r = cell[sz + '\u0000' + c]; if (!r) return '<td class="c na">·</td>';
      const q = r.qty; rt += q; colTot[si] += q;
      const cls = q < 0 ? 'neg' : q === 0 ? (clickable ? 'zero' : 'zp') : (r.reorder > 0 && q <= r.reorder) ? 'lowc' : '';
      return `<td class="c ${cls} ${clickable && r.sku ? 'clk' : ''}" ${clickable && r.sku ? `data-sku="${esc(r.sku)}" title="${esc(describe(r))}"` : ''}>${num(q)}</td>`;
    }).join('');
    grand += rt;
    const first = rows.find(r => r.colour === c), ph = first ? photoFor(first.item, c) : '';
    return `<tr><td class="sn">${ci + 1}</td><td class="cl ${ph ? 'hasph' : ''}" ${ph ? `data-photo="${esc(ph)}" data-cap="${esc(first.item + ' · ' + (c || 'All'))}" title="Tap to see the photo"` : ''}>${swatch(c, first && first.item)}${esc(c || 'All')}</td>${tds}<td class="c rt">${num(rt)}</td></tr>`;
  }).join('');
  return {total: grand, html: `<div class="regwrap"><table class="reg"><thead><tr><th class="sn">SN</th><th class="cl">${cols.some(c => c) ? 'Colour' : ''}</th>${sizes.map(sz => `<th>${esc(sz || '—')}</th>`).join('')}<th class="rt">Total</th></tr></thead>
    <tbody>${body}</tbody><tfoot><tr><td class="sn"></td><td class="cl">Total</td>${colTot.map(t => `<td>${num(t)}</td>`).join('')}<td class="gt">${num(grand)}</td></tr></tfoot></table></div>`,
    csv: [['Colour', ...sizes.map(x => x || '-'), 'Total']].concat(cols.map(c => [c || 'All', ...sizes.map(sz => cell[sz + '\u0000' + c]?.qty ?? ''), sizes.reduce((a, sz) => a + (cell[sz + '\u0000' + c]?.qty || 0), 0)]), [['Total', ...colTot, grand]])};
}
const RG = {item: '', q: ''};

    $$('#rbody td.clk').forEach(td => td.onclick = () => skuDialog(td.dataset.sku));

/* ── public live stock: no sign-in, quantities only ── */
const PUB = {rows: null, at: 0, err: '', q: '', all: false, busy: false};
async function loadPublic(quiet) {
  if (PUB.busy) return; PUB.busy = true;
  try {
    let d;
    if (isLive()) d = await post({action: 'publicStock'}); else d = {ok: true, rows: []};
    if (!d.ok && (d.auth || /sign in/i.test(d.error || ''))) throw new Error('Live stock is not switched on yet. The Super admin must publish the latest Code.gs in Apps Script (Deploy → Manage deployments → Edit → New version → Deploy).');
    if (!d.ok) throw new Error(d.error || 'Could not load stock.');
    PUB.rows = d.rows; PUB.at = Date.now(); PUB.err = '';
  } catch (e) { PUB.err = e.message; }
  PUB.busy = false;
  if (!signedIn() && !location.hash.startsWith('#/login')) render();
}
setInterval(() => { if (!signedIn() && !document.hidden && !location.hash.startsWith('#/login') && !PUB.busy && Date.now() - PUB.at > 55000) loadPublic(true); }, 15000);
function publicView(v) {
  if (!PUB.rows && !PUB.err && !PUB.busy) loadPublic();
  if (PUB.at && Date.now() - PUB.at > 30000 && !PUB.busy) loadPublic(true);
  if (!PUB.rows) { v.innerHTML = PUB.err ? `<div class="banner bad"><b>Could not load stock.</b> ${esc(PUB.err)} <button class="btn sm" id="pRetry" style="margin-left:8px">Try again</button></div>` : '<div class="spin" aria-label="Loading"></div>';

  if (!$('#pq')) {
    v.innerHTML = `<h1>Live stock</h1>
    <div class="tools"><div class="grow"><input id="pq" type="search" placeholder="Search item, colour or size…" aria-label="Search stock" value="${esc(PUB.q)}"></div>
      <label class="inl"><input type="checkbox" id="pall" ${PUB.all ? 'checked' : ''}> show items with no stock</label>
      <span class="sp"></span><button class="btn ghost sm" id="pRef">Refresh</button></div>
    <div class="small muted" id="psum" style="margin:0 2px 10px"></div><div id="plist"></div>`;
    $('#pq').addEventListener('input', e => { PUB.q = e.target.value; drawPublic(); });
    $('#pall').addEventListener('input', e => { PUB.all = e.target.checked; drawPublic(); });

  }

}
function drawPublic() {
  const toks = PUB.q.toLowerCase().split(/\s+/).filter(Boolean), groups = new Map();
  PUB.rows.forEach(r => { if (toks.every(t => [r.item, r.colour, r.size].join(' ').toLowerCase().includes(t))) (groups.get(r.item) || groups.set(r.item, []).get(r.item)).push(r); });
  const names = [...groups.keys()].filter(n => PUB.all || groups.get(n).some(r => r.qty > 0)).sort((a, b) => a.localeCompare(b));
  const units = names.reduce((a, n) => a + groups.get(n).reduce((x, r) => x + r.qty, 0), 0);
  const t = PUB.at ? new Date(PUB.at).toLocaleTimeString('en-IN', {hour: '2-digit', minute: '2-digit'}) : '';
  $('#psum').innerHTML = `<span class="live-dot"><span class="dot live"></span>Live from the stock sheet${t ? ' · updated ' + t : ''}</span> · ${num(names.length)} item${names.length === 1 ? '' : 's'} · <b>${num(units)}</b> pieces`;
  $('#plist').innerHTML = names.length ? names.map(n => {
    const t = registerTable(groups.get(n), false);
    return `<div class="card pubitem"><div class="ph"><h2>${esc(n)}</h2><span class="muted small"><b>${num(t.total)}</b> pcs</span></div>${t.html}</div>`; }).join('') : '<div class="card empty">Nothing matches.</div>';
}

function render() {
  const {route: r, q} = parseHash();
  chrome(r);
  const v = $('#view');
  if (!signedIn()) {
    const onLogin = location.hash.startsWith('#/login');
    document.body.classList.toggle('onlogin', onLogin);
    if (onLogin) { if (!$('#lf')) loginView(v); } else publicView(v);
    return;
  }
  document.body.classList.remove('onlogin');
  if (r === 'settings') { views.settings(v); return; }
  if (!state.loaded) { v.innerHTML = state.error
      ? `<div class="banner bad"><b>Could not load data.</b> ${esc(state.error)} <button class="btn sm" id="retry" style="margin-left:8px">Try again</button></div>`

function attachSuggest(input, onPick) {
  const box = document.createElement('div'); box.className = 'suggest'; box.hidden = true;
  input.parentElement.style.position = 'relative'; input.parentElement.appendChild(box);
  let items = [], idx = 0;
  const matches = q => {
    const toks = q.toLowerCase().split(/\s+/).filter(Boolean); let rows = state.calc.rows.filter(r => r.active);
    if (!toks.length) return rows.sort((a, b) => b.lastMove.localeCompare(a.lastMove)).slice(0, 8);
    rows = rows.filter(r => { const h = [r.sku, r.item, r.size, r.colour, r.category].join(' ').toLowerCase(); return toks.every(t => h.includes(t)); });
    return rows.sort((a, b) => (b.sku.toLowerCase() === q.toLowerCase()) - (a.sku.toLowerCase() === q.toLowerCase())).slice(0, 8);
  };
  const hl = () => $$('.sg', box).forEach((d, i) => d.classList.toggle('on', i === idx));
  const draw = () => {
    items = matches(input.value); idx = 0;
    box.innerHTML = items.length ? items.map((r, i) => `<div class="sg ${i === 0 ? 'on' : ''}" data-i="${i}"><div><b>${esc(r.sku)}</b><div class="small muted">${esc(describe(r))}</div></div>
      <div class="small ${r.onHand <= 0 ? 'bad' : ''}" style="text-align:right;white-space:nowrap">${num(r.onHand)}<br>in stock</div></div>`).join('') : '<div class="sg muted">No matching SKU</div>';
    box.hidden = false;
  };
  const pick = r => { input.value = ''; box.hidden = true; onPick(r); };
  input.addEventListener('input', draw); input.addEventListener('focus', draw);
  input.addEventListener('keydown', e => {
    if (box.hidden) return;
    if (e.key === 'ArrowDown') { idx = Math.min(idx + 1, items.length - 1); hl(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { idx = Math.max(idx - 1, 0); hl(); e.preventDefault(); }
    else if (e.key === 'Enter') { if (items[idx]) { e.preventDefault(); pick(items[idx]); } }
    else if (e.key === 'Escape') box.hidden = true;
  });
  box.addEventListener('pointerdown', e => { const d = e.target.closest('[data-i]'); if (d) { e.preventDefault(); pick(items[+d.dataset.i]); } });
  input.addEventListener('blur', () => setTimeout(() => box.hidden = true, 150));
}

/* ════════════════════════ new entry ════════════════════════ */
const E = {type: 'SALE', date: '', party: '', ref: '', notes: '', lines: [], mode: 'grid', item: '', err: ''};
function addLine(sku, qty = 1) {
  const it = bySku(sku); if (!it) return null;
  let l = E.lines.find(x => x.sku === it.sku);
  if (l) l.qty += qty; else { l = {id: newId(), sku: it.sku, qty, rate: rateFor(it, E.type), auto: true}; E.lines.push(l); }
  return l;
}
views.entry = (el, q) => {
  if (!E.date) E.date = today();
  if (!TYPES[E.type] || TYPES[E.type].hide) E.type = 'SALE';
  if (q.type && TYPES[q.type] && !TYPES[q.type].hide) E.type = q.type;
  if (q.sku && bySku(q.sku)) { E.lines = E.lines.filter(l => l.sku !== q.sku.toUpperCase()); addLine(q.sku); history.replaceState(null, '', '#/entry'); }
  const t = () => TYPES[E.type];
  el.innerHTML = `<h1>New stock entry</h1>
  <div class="card" style="margin-bottom:14px">
    <label>What are you recording?</label>
    <div class="seg types" id="types">${Object.entries(TYPES).filter(([, x]) => !x.hide).map(([k, x]) => `<button type="button" data-type="${k}" data-dir="${x.dir}" class="${k === E.type ? 'on' : ''}">${x.short}</button>`).join('')}</div>
    <div class="dirnote" id="dirnote"></div>
    <div class="row" style="margin-top:14px;margin-bottom:0">
      <div class="field"><label>Date</label><input type="date" id="eDate" value="${esc(E.date)}"></div>
      <div class="field"><label id="partyLbl">Party</label><input id="eParty" value="${esc(E.party)}" placeholder="Name (optional)" autocomplete="off"></div>
      <div class="field"><label>Invoice / ref no.</label><input id="eRef" value="${esc(E.ref)}" placeholder="Optional" autocomplete="off"></div>
    </div></div>
  <div class="card" style="margin-bottom:14px">
    <div class="tabs2"><button data-mode="grid" class="${E.mode === 'grid' ? 'on' : ''}">By size &amp; colour</button><button data-mode="search" class="${E.mode === 'search' ? 'on' : ''}">Search SKU</button></div>
    <div id="adder"></div></div>
  <div class="card"><h2>Lines in this entry</h2><div id="elines"></div><div class="err" id="eErr"></div></div>
  <div class="savebar"><div class="sum"><b id="sAmt">₹0</b><span id="sInfo">0 lines · 0 pcs</span></div><button class="btn ghost" id="clear">Clear</button><button class="btn" id="save">Save entry</button></div>`;

  /* header */
  const dirnote = () => {
    $('#partyLbl').textContent = ['SALE', 'SALE_RETURN'].includes(E.type) ? 'Customer' : ['PURCHASE', 'PURCHASE_RETURN'].includes(E.type) ? 'Supplier' : 'Party / reason';
    const n = $('#dirnote'); n.className = 'dirnote ' + (t().dir > 0 ? 'in' : 'out');
    n.textContent = t().dir > 0 ? `Stock goes IN · rate defaults to ${t().rate === 'sale' ? 'sale' : 'cost'} rate` : `Stock goes OUT · rate defaults to ${t().rate === 'sale' ? 'sale' : 'cost'} rate`;
  };
  $$('#types button').forEach(b => b.onclick = () => {
    E.type = b.dataset.type; $$('#types button').forEach(x => x.classList.toggle('on', x === b));
    E.lines.forEach(l => { if (l.auto) l.rate = rateFor(bySku(l.sku), E.type); });
    dirnote(); drawAdder(); drawLines();
  });
  $('#eDate').oninput = e => E.date = e.target.value; $('#eParty').oninput = e => E.party = e.target.value; $('#eRef').oninput = e => E.ref = e.target.value;
  $$('.tabs2 button').forEach(b => b.onclick = () => { E.mode = b.dataset.mode; $$('.tabs2 button').forEach(x => x.classList.toggle('on', x === b)); drawAdder(); });

  /* adder: size grid or SKU search */
  function drawAdder() {
    const box = $('#adder');
    if (E.mode === 'search') {
      box.innerHTML = `<div class="field"><label>Type SKU, item, colour or size</label><input id="sq" placeholder="e.g. polo navy xl" autocomplete="off" enterkeyhint="search"></div><div class="hint" style="margin-top:8px">Tap a result to add it, then enter the quantity below.</div>`;
      attachSuggest($('#sq'), r => { const l = addLine(r.sku); drawLines(); focusQty(l); });
      return;
    }
    const groups = new Map(); state.calc.rows.filter(r => r.active).forEach(r => { (groups.get(r.item) || groups.set(r.item, []).get(r.item)).push(r); });
    const names = [...groups.keys()].sort((a, b) => a.localeCompare(b));
    if (!names.length) { box.innerHTML = '<div class="empty">No items yet. <a href="#/items">Add items first</a>.</div>'; return; }
    if (!groups.has(E.item)) E.item = '';
    box.innerHTML = `<div class="field" style="margin-bottom:12px"><label>Item</label><select id="gItem"><option value="">Choose an item…</option>${names.map(n => `<option ${n === E.item ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div><div id="gridBox"></div>`;
    $('#gItem').onchange = e => { E.item = e.target.value; drawGrid(groups); };
    drawGrid(groups);
  }
  function drawGrid(groups) {
    const gb = $('#gridBox'); const rows = groups.get(E.item);
    if (!rows) { gb.innerHTML = '<div class="hint">Pick an item to see its sizes and colours, then type quantities straight into the grid.</div>'; return; }
    const sizes = [...new Set(rows.map(r => r.size))].sort((a, b) => sizeRank(a) - sizeRank(b) || a.localeCompare(b));
    const cols = [...new Set(rows.map(r => r.colour))].sort((a, b) => a.localeCompare(b));
    const cell = {}; rows.forEach(r => cell[r.size + '\u0000' + r.colour] = r);
    gb.innerHTML = `<div class="grid-entry"><table><thead><tr><th>${rows.some(r => r.colour) ? 'Colour' : ''}</th>${sizes.map(s => `<th>${esc(s || '—')}</th>`).join('')}</tr></thead><tbody>
      ${cols.map(c => `<tr><td>${esc(c || 'All')}</td>${sizes.map(s => { const r = cell[s + '\u0000' + c];
        return r ? `<td><input type="number" inputmode="numeric" min="0" step="1" placeholder="0" data-sku="${esc(r.sku)}" aria-label="${esc(r.sku)}"><small>${num(r.onHand)} in stock</small></td>` : '<td class="na">–</td>'; }).join('')}</tr>`).join('')}
      </tbody></table></div><div class="hint" style="margin:8px 0">Type how many pieces for each size and colour.</div>
      <button class="btn block" id="gAdd" disabled>Add to entry</button><div class="err" id="gErr"></div>`;
    const inputs = $$('#gridBox input'), btn = $('#gAdd');
    const upd = () => { const n = inputs.reduce((a, i) => a + (+i.value || 0), 0); btn.disabled = !n; btn.textContent = n ? `Add ${num(n)} pcs to entry` : 'Add to entry'; };
    inputs.forEach(i => { i.addEventListener('input', () => { i.classList.remove('invalid'); upd(); }); i.addEventListener('focus', () => i.select()); });
    btn.onclick = () => {
      const add = inputs.filter(i => +i.value > 0).map(i => ({r: bySku(i.dataset.sku), q: Math.round(+i.value), i}));
      if (t().dir < 0) {
        const bad = add.filter(a => a.q + (E.lines.find(l => l.sku === a.r.sku)?.qty || 0) > a.r.onHand);
        if (bad.length) { bad.forEach(b => b.i.classList.add('invalid')); $('#gErr').textContent = `Not enough stock: ${bad.map(b => `${b.r.sku} (has ${num(b.r.onHand)})`).join(', ')}`; return; }
      }
      add.forEach(a => addLine(a.r.sku, a.q)); inputs.forEach(i => i.value = ''); upd(); $('#gErr').textContent = '';
      toast(`Added ${add.length} line${add.length > 1 ? 's' : ''}`); drawLines();
      $('#elines').scrollIntoView({behavior: 'smooth', block: 'nearest'});
    };
  }

  /* review lines */
  function focusQty(l) { const i = $(`[data-line="${l.id}"] .lq`); if (i) { i.focus(); i.select(); } }
  function totals() {
    const pcs = E.lines.reduce((a, l) => a + (+l.qty || 0), 0), amt = E.lines.reduce((a, l) => a + (+l.qty || 0) * (+l.rate || 0), 0);
    $('#sAmt').textContent = inr(amt); $('#sInfo').textContent = `${E.lines.length} line${E.lines.length === 1 ? '' : 's'} · ${num(pcs)} pcs`;
    $('#save').disabled = !E.lines.length;
  }
  function drawLines() {
    const box = $('#elines');
    box.innerHTML = E.lines.length ? E.lines.map(l => { const it = bySku(l.sku); const over = t().dir < 0 && l.qty > it.onHand;
      return `<div class="eline" data-line="${l.id}"><div class="ed"><b>${esc(l.sku)}</b><div class="small muted">${esc(describe(it))} · <span class="${over ? 'bad' : ''}">${num(it.onHand)} in stock</span></div></div>
      <div class="ctl"><div class="stepper"><button type="button" data-d="-1" aria-label="Decrease">−</button><input class="lq" type="number" inputmode="numeric" min="1" step="1" value="${l.qty}" aria-label="Quantity"><button type="button" data-d="1" aria-label="Increase">+</button></div>
        <div class="rate"><span class="small muted">₹</span><input class="lr" type="number" inputmode="decimal" min="0" step="0.01" value="${l.rate}" aria-label="Rate"></div>
        <div class="amt">${inr(l.qty * l.rate)}</div></div><button type="button" class="x" data-rm aria-label="Remove line">${ic('x')}</button></div>`; }).join('')
      : '<div class="empty">Nothing added yet.<br>Pick an item above and enter quantities.</div>';
    totals();
  }
  const lineOf = e => { const row = e.target.closest('[data-line]'); return row && {row, l: E.lines.find(x => x.id === row.dataset.line)}; };
  const refreshRow = (row, l) => { $('.amt', row).textContent = inr(l.qty * l.rate); totals(); };
  const eb = $('#elines');
  eb.addEventListener('input', e => { const x = lineOf(e); if (!x || !x.l) return;
    if (e.target.classList.contains('lq')) x.l.qty = Math.round(+e.target.value) || 0; if (e.target.classList.contains('lr')) { x.l.rate = +e.target.value || 0; x.l.auto = false; } refreshRow(x.row, x.l); });
  eb.addEventListener('click', e => { const x = lineOf(e); if (!x || !x.l) return; const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.rm !== undefined) { E.lines = E.lines.filter(l => l !== x.l); drawLines(); }
    else if (b.dataset.d) { x.l.qty = Math.max(1, (+x.l.qty || 0) + +b.dataset.d); $('.lq', x.row).value = x.l.qty; refreshRow(x.row, x.l); } });
  eb.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('lq')) { e.preventDefault(); $('#sq')?.focus(); } });

  $('#clear').onclick = () => { E.lines = []; E.err = ''; $('#eErr').textContent = ''; drawLines(); };
  $('#save').onclick = async () => {
    const err = $('#eErr'); err.textContent = '';
    if (!E.date) { err.textContent = 'Pick a date.'; return; }
    if (!E.lines.length) { err.textContent = 'Add at least one line.'; return; }
    const need = {};
    for (const [i, l] of E.lines.entries()) {
      const it = bySku(l.sku), n = i + 1;
      if (!it || !it.active) { err.textContent = `Line ${n}: ${l.sku} is not available.`; return; }
      if (!(l.qty > 0) || Math.round(l.qty) !== l.qty) { err.textContent = `Line ${n} (${l.sku}): enter a whole-number quantity.`; return; }
      if (t().dir < 0) { need[l.sku] = (need[l.sku] || 0) + l.qty; if (need[l.sku] > it.onHand) { err.textContent = `Line ${n}: ${l.sku} has only ${num(it.onHand)} in stock.`; return; } }
    }
    const movements = E.lines.map(l => ({id: l.id, date: E.date, type: E.type, sku: l.sku, qty: l.qty, rate: +l.rate || 0, party: E.party.trim(), ref: E.ref.trim(), notes: E.notes}));
    $('#save').disabled = true;
    const r = await write('addMovements', {movements}, `Saved ${movements.length} line${movements.length > 1 ? 's' : ''}`, () => { E.lines = []; E.party = ''; E.ref = ''; });
    if (r?.duplicates?.length) toast(`${r.duplicates.length} line(s) had already been saved earlier`);
    if (!r) $('#save').disabled = false;
  };
  dirnote(); drawAdder(); drawLines();
};

  $('#mc').addEventListener('input', e => { MF.c = e.target.checked; draw(); }); draw();
  $('#mcsv').onclick = () => downloadCsv('movements-' + today() + '.csv',
    [['ID','Date','Type','Item','Colour','Size','SKU','Qty','Signed qty','Rate','Party','Ref','Entered by','Status','Cancelled by','Cancel reason']]
      .concat(draw.rows.map(m => [m.id, m.date, m.type, m.item, m.colour, m.size, m.sku, m.qty, m.signedQty, m.rate, m.party, m.ref, m.enteredBy, m.status, m.cancelledBy, m.cancelReason])));
};
function cancelDialog(id) {
  const m = state.moves.find(x => x.id === id); if (!m) return;
  const d = openDlg(`<h2>Cancel this entry?</h2>
    <p><b>${esc(m.sku || m.item)}</b> · ${esc(TYPES[m.type]?.short)} · ${num(m.signedQty)} pcs · ${esc(m.date)}${m.party ? ' · ' + esc(m.party) : ''}</p>
    <p class="muted small">The entry stays in the sheet marked CANCELLED and no longer counts towards stock.</p>
    <div class="field"><label>Reason (optional)</label><input id="cReason" placeholder="e.g. wrong size entered" autocomplete="off"></div>
    <div class="actions"><button class="btn ghost" data-close>Keep it</button><button class="btn danger" id="cGo">Cancel entry</button></div>`);
  $('#cGo', d).onclick = async () => { if (!can.admin()) return; const reason = $('#cReason', d).value.trim(); d.close(); await write('cancelMovement', {id, reason}, 'Entry cancelled'); };
}

/* ════════════════════════ items ════════════════════════ */
views.items = el => {
  if (!can.admin()) { el.innerHTML = '<div class="card empty">Only the Super admin can manage items.</div>'; return; }
  const open = !state.items.length ? 'open' : '';
  el.innerHTML = `<h1>Items</h1>
  <details class="card" ${open} style="margin-bottom:14px"><summary>Add a new item with sizes &amp; colours</summary>
    <p class="hint" style="margin-top:0">New rows are added to the <b>Stock Movement</b> tab with opening stock 0. Short codes (SKUs) are created automatically.</p>
    <div class="row">
      <div class="field"><label>Item name</label><input id="aName" placeholder="e.g. Polo T-Shirt" autocomplete="off"></div>
      <div class="field"><label>Category</label><input id="aCat" list="catList" placeholder="e.g. Polo T-Shirts" autocomplete="off"></div>
      <div class="field"><label>HSN</label><input id="aHsn" list="hsnList" inputmode="numeric" placeholder="e.g. 6105" autocomplete="off"></div>
      <div class="field"><label>GST %</label><input id="aGst" type="number" inputmode="decimal" min="0" step="0.01" value="5"></div>
    </div>
    <div class="row">
      <div class="field"><label>Cost rate ₹</label><input id="aCost" type="number" inputmode="decimal" min="0" step="0.01"></div>
      <div class="field"><label>Sale rate ₹</label><input id="aSale" type="number" inputmode="decimal" min="0" step="0.01"></div>
      <div class="field"><label>Reorder level (per SKU)</label><input id="aRe" type="number" inputmode="numeric" min="0" step="1" value="10"></div>
    </div>
    <div class="row">
      <div class="field"><label>Sizes (comma separated)</label><input id="aSizes" value="S, M, L, XL, XXL">
        <div class="chips">${['S, M, L, XL, XXL', 'M, L, XL', '28, 30, 32, 34, 36', 'Free size'].map(s => `<button type="button" class="chip" data-sz="${s}">${s}</button>`).join('')}</div></div>
      <div class="field"><label>Colours (comma separated)</label><input id="aCols" placeholder="Navy, Black, Royal Blue" autocomplete="off"><div class="hint" style="margin-top:6px">Leave empty if the item has no colour variants.</div></div>
    </div>
    <datalist id="catList">${[...new Set(state.items.map(i => i.category).filter(Boolean))].map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <datalist id="hsnList">${HSN_HINTS.map(([h, d]) => `<option value="${h}">${esc(d)}</option>`).join('')}</datalist>
    <div id="aPrev"></div><div class="err" id="aErr"></div>
    <div style="margin-top:12px"><button class="btn" id="aSave">Add to sheet</button></div>
    <p class="hint">HSN suggestions are only hints. Confirm HSN and GST rate before using them on invoices.</p>
  </details>
  <div class="tools"><div class="grow"><input id="iq" type="search" placeholder="Search items…" aria-label="Search items"></div><label class="inl"><input type="checkbox" id="iin"> inactive</label></div>
  <div id="itbl"></div>`;

  const parseList = s => s.split(',').map(x => x.trim()).filter(Boolean);
  const existing = new Set(state.items.map(i => keyOf(i.item, i.colour, i.size)));
  let generated = [];
  const gen = () => {
    const name = $('#aName').value.trim();
    const sizes = [...new Set(parseList($('#aSizes').value))], cols = [...new Set(parseList($('#aCols').value))];
    const S = sizes.length ? sizes : [''], C = cols.length ? cols : [''];
    generated = []; S.forEach(sz => C.forEach(c => generated.push({size: sz, colour: c})));
    const seen = new Set(); generated.forEach(g => { const k = keyOf(name, g.colour, g.size); g.dup = existing.has(k) ? 'exists' : seen.has(k) ? 'clash' : ''; seen.add(k); });
    const bad = generated.filter(g => g.dup).length;
    $('#aPrev').innerHTML = name ? `<h3 style="margin-top:6px">${generated.length} row${generated.length > 1 ? 's' : ''} will be added</h3><div class="tablewrap" style="max-height:240px"><table class="stack"><thead><tr><th>Item</th><th>Size</th><th>Colour</th><th></th></tr></thead><tbody>
      ${generated.map(g => `<tr><td class="p"><b>${esc(name)}</b></td><td>${esc(g.size || '—')}</td><td>${esc(g.colour || '—')}</td><td>${g.dup ? `<span class="pill out">${g.dup === 'exists' ? 'ALREADY EXISTS' : 'DUPLICATE'}</span>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '';
    stackTables($('#aPrev'));
    $('#aErr').textContent = bad ? 'Some of these already exist in the sheet. Remove them from the sizes/colours, or change the item name.' : '';
    $('#aSave').disabled = !name || !!bad || !generated.length;
  };
  ['aName', 'aSizes', 'aCols'].forEach(id => $('#' + id).addEventListener('input', gen));
  $$('.chip').forEach(c => c.onclick = () => { $('#aSizes').value = c.dataset.sz; gen(); });
  $('#aSave').onclick = async () => {
    if (!can.admin()) return;
    const items = generated.map(g => ({item: $('#aName').value.trim(), category: $('#aCat').value.trim(), size: g.size, colour: g.colour, opening: 0,
      hsn: $('#aHsn').value.trim(), gst: +$('#aGst').value || 0, cost: +$('#aCost').value || 0, sale: +$('#aSale').value || 0, reorder: +$('#aRe').value || 0, active: true}));
    $('#aSave').disabled = true;
    const r = await write('saveItems', {items}, `Added ${items.length} row${items.length > 1 ? 's' : ''}`);
    if (r) { E.item = items[0].item; location.hash = '#/items'; } else gen();
  };
  gen();

  const draw = () => {
    const q = $('#iq').value.trim().toLowerCase(), inact = $('#iin').checked;
    const rows = state.items.filter(i => (inact || i.active) && (!q || [i.sku, i.item, i.category, i.colour, i.hsn].join(' ').toLowerCase().includes(q)));
    $('#itbl').innerHTML = rows.length ? `<div class="tablewrap"><table class="stack"><thead><tr><th>SKU</th><th>Category</th><th>HSN</th><th class="n">GST %</th><th class="n">Opening</th><th class="n">Cost</th><th class="n">Sale</th><th class="n">Reorder</th><th></th></tr></thead><tbody>
      ${rows.map(i => `<tr><td class="p"><b>${esc(i.sku)}</b>${i.active ? '' : ' <span class="pill off">INACTIVE</span>'}<div class="small muted" style="white-space:normal">${esc(describe(i))}</div></td><td class="hm">${esc(i.category)}</td><td class="hm">${esc(i.hsn)}</td><td class="n hm">${i.gst}</td>
        <td class="n hm">${num(i.opening)}</td><td class="n">${inr(i.cost)}</td><td class="n">${inr(i.sale)}</td><td class="n hm">${num(i.reorder)}</td><td class="noL"><button class="btn ghost sm" data-edit="${esc(i.sku)}">Edit</button></td></tr>`).join('')}
      </tbody></table></div>` : '<div class="card empty">No items yet. Add your first item above.</div>';
    stackTables($('#itbl')); $$('[data-edit]').forEach(b => b.onclick = () => editDialog(b.dataset.edit));
  };
  $('#iq').addEventListener('input', draw); $('#iin').addEventListener('input', draw); draw();
};
function editDialog(sku) {
  if (!can.admin()) return;
  const i = state.items.find(x => x.sku === sku); if (!i) return;
  const d = openDlg(`<div class="dh"><div><h2>Edit ${esc(i.sku)}</h2><div class="muted small">${esc(describe(i))}</div></div><button class="xbtn" data-close aria-label="Close">${ic('x')}</button></div>
    <p class="hint" style="margin-top:0">Item, colour and size can only be changed in the sheet, because past entries are linked to them by name.</p>
    <div class="row"><div class="field"><label>Category</label><input id="xCat" value="${esc(i.category)}"></div>
      <div class="field"><label>Opening stock</label><input id="xOpen" type="number" inputmode="numeric" min="0" step="1" value="${i.opening}"></div>
      <div class="field"><label>HSN</label><input id="xHsn" value="${esc(i.hsn)}"></div><div class="field"><label>GST %</label><input id="xGst" type="number" inputmode="decimal" min="0" step="0.01" value="${i.gst}"></div>
      <div class="field"><label>Cost rate ₹</label><input id="xCost" type="number" inputmode="decimal" min="0" step="0.01" value="${i.cost}"></div><div class="field"><label>Sale rate ₹</label><input id="xSale" type="number" inputmode="decimal" min="0" step="0.01" value="${i.sale}"></div>
      <div class="field"><label>Reorder level</label><input id="xRe" type="number" inputmode="numeric" min="0" step="1" value="${i.reorder}"></div>
      <div class="field"><label>Status</label><select id="xAct"><option value="1" ${i.active ? 'selected' : ''}>Active</option><option value="0" ${i.active ? '' : 'selected'}>Inactive (hidden from entry)</option></select></div></div>
    <div class="actions"><button class="btn ghost" data-close>Close</button><button class="btn" id="xGo">Save changes</button></div>`);
  $('#xGo', d).onclick = async () => {
    const item = {sku: i.sku, item: i.item, colour: i.colour, size: i.size, category: $('#xCat', d).value.trim(), hsn: $('#xHsn', d).value.trim(), opening: +$('#xOpen', d).value || 0,
      gst: +$('#xGst', d).value || 0, cost: +$('#xCost', d).value || 0, sale: +$('#xSale', d).value || 0, reorder: +$('#xRe', d).value || 0, active: $('#xAct', d).value === '1'};
    d.close(); await write('saveItem', {item}, 'Item updated');
  };
}

/* ════════════════════════ reports ════════════════════════ */
views.reports = el => {
  const rows = state.calc.rows.filter(r => r.active);
  const hsn = new Map(); rows.forEach(r => { const k = (r.hsn || '(none)') + '|' + r.gst; const g = hsn.get(k) || {hsn: r.hsn || '(none)', gst: r.gst, skus: 0, qty: 0, val: 0}; g.skus++; g.qty += Math.max(r.onHand, 0); g.val += r.value; hsn.set(k, g); });
  const hsnRows = [...hsn.values()].sort((a, b) => a.hsn.localeCompare(b.hsn));
  const cm = new Map(); rows.forEach(r => { const k = r.category || '(uncategorised)'; const g = cm.get(k) || {k, skus: 0, qty: 0, val: 0}; g.skus++; g.qty += Math.max(r.onHand, 0); g.val += r.value; cm.set(k, g); });
  const cat = [...cm.values()].sort((a, b) => b.val - a.val);
  const reorder = rows.filter(r => r.hasMoves && r.reorder > 0 && r.onHand <= r.reorder).sort((a, b) => (a.onHand - a.reorder) - (b.onHand - b.reorder));
  const sum = a => ({skus: a.reduce((s, x) => s + x.skus, 0), qty: a.reduce((s, x) => s + x.qty, 0), val: a.reduce((s, x) => s + x.val, 0)});
  const th = sum(hsnRows);
  el.innerHTML = `<h1>Reports</h1><div class="tools"><span class="muted small">Value = on-hand × weighted-average cost (opening stock at the item’s cost rate, plus purchases at their rates).</span><span class="sp"></span><button class="btn ghost sm" onclick="window.print()">Print</button></div>
  <div class="card" style="margin-bottom:14px"><div class="tools" style="margin-bottom:8px"><h2 style="margin:0">HSN-wise stock summary</h2><span class="sp"></span><button class="btn ghost sm" id="hcsv">CSV</button></div>
    ${hsnRows.length ? `<div class="tablewrap"><table class="stack"><thead><tr><th>HSN</th><th class="n">GST %</th><th class="n">SKUs</th><th class="n">Units</th><th class="n">Stock value</th><th class="n">Est. GST on value</th></tr></thead><tbody>
      ${hsnRows.map(g => `<tr><td class="p"><b>${esc(g.hsn)}</b></td><td class="n">${g.gst}</td><td class="n">${g.skus}</td><td class="n">${num(g.qty)}</td><td class="n">${inr(g.val)}</td><td class="n">${inr(g.val * g.gst / 100)}</td></tr>`).join('')}
      <tr class="tot"><td class="p">Total</td><td></td><td class="n">${th.skus}</td><td class="n">${num(th.qty)}</td><td class="n">${inr(th.val)}</td><td></td></tr></tbody></table></div>` : '<div class="empty">No items.</div>'}
    <p class="small muted">“Est. GST on value” is stock value × GST rate, for reference only.</p></div>
  <div class="grid two"><div class="card"><h2>Category-wise value</h2>${cat.length ? `<div class="tablewrap"><table class="stack"><thead><tr><th>Category</th><th class="n">SKUs</th><th class="n">Units</th><th class="n">Value</th></tr></thead><tbody>
      ${cat.map(g => `<tr><td class="p"><b>${esc(g.k)}</b></td><td class="n">${g.skus}</td><td class="n">${num(g.qty)}</td><td class="n">${inr(g.val)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No items.</div>'}</div>
    <div class="card"><div class="tools" style="margin-bottom:8px"><h2 style="margin:0">Reorder list</h2><span class="sp"></span><button class="btn ghost sm" id="rcsv">CSV</button></div>${reorder.length ? `<div class="tablewrap"><table class="stack"><thead><tr><th>SKU</th><th class="n">On hand</th><th class="n">Reorder at</th><th class="n">Short by</th></tr></thead><tbody>
      ${reorder.map(r => `<tr><td class="p"><b>${esc(r.sku)}</b> <span class="small muted">${esc(describe(r))}</span></td><td class="n">${num(r.onHand)}</td><td class="n">${num(r.reorder)}</td><td class="n"><b>${num(Math.max(r.reorder - r.onHand, 0))}</b></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Nothing to reorder.</div>'}</div></div>`;
  $('#hcsv').onclick = () => downloadCsv('hsn-summary-' + today() + '.csv', [['HSN','GST %','SKUs','Units','Stock value']].concat(hsnRows.map(g => [g.hsn, g.gst, g.skus, g.qty, g.val.toFixed(2)])));
  $('#rcsv').onclick = () => downloadCsv('reorder-' + today() + '.csv', [['SKU','Item','On hand','Reorder level','Short by']].concat(reorder.map(r => [r.sku, describe(r), r.onHand, r.reorder, Math.max(r.reorder - r.onHand, 0)])));
};

/* ════════════════════════ account ════════════════════════ */
views.settings = el => {
  const u = me(), live = isLive();
  const perms = {ADMIN: 'You can see everything, record stock, add and edit items, and cancel entries.', EDITOR: 'You can see stock and record inward / outward entries.', VIEWER: 'You can view stock and reports only.'}[u.role] || '';
  el.innerHTML = `<h1>Account</h1><div class="card" style="max-width:640px;margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:12px"><span class="logo" style="width:46px;height:46px;font-size:19px;border-radius:50%">${esc((u.name || '?').charAt(0).toUpperCase())}</span>
      <div><div style="font-size:18px;font-weight:800">${esc(u.name)}</div><span class="rolepill">${esc(ROLES[u.role] || u.role)}</span></div></div>
    <p class="muted">${esc(perms)}</p>
    <p class="small muted">${live ? 'Data is read from and saved to your Google Sheet. If the sheet is changed directly, tap the reload button at the top to see it here.' : 'You are using demo data that lives only in this browser.'}</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><button class="btn" id="sOut">${live ? 'Sign out' : 'Exit demo'}</button>
      ${live ? '' : '<button class="btn danger" id="sReset">Reset demo data</button>'}</div></div>`;
  $('#sOut').onclick = () => { if (live) endSession(''); else location.href = location.pathname; };
  const rs = $('#sReset'); if (rs) rs.onclick = () => { if (confirm('Erase the demo data in this browser?')) { localStorage.removeItem(DEMO_KEY); refresh(true); } };
};

refresh(true);
</script>
</body>
</html>
